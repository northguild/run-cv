name: Pages

# The terminal under docs/run-cv/ is generated, so it is built here rather than
# committed. Pages must be set to "GitHub Actions" as its source for the deploy
# job to have anywhere to publish to:
#
#   gh api -X PUT repos/northguild/run-cv/pages -f build_type=workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue rather than cancel, so a merge is not
# dropped by the one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The themed PDFs are committed in public/ rather than regenerated: they
      # need a real browser, and nothing else in this repo's CI has ever
      # installed one. Regenerate them locally with `pnpm build:pdfs`.
      - name: Build the terminal
        run: pnpm run build:web

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
