name: CI

on:
  push:
    branches: [main, feat/**, fix/**, chore/**]
  pull_request:
    branches: [main, feat/**, fix/**, chore/**]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Debug
        run: |
          node -v
          pnpm -v
          pnpm list --depth=0

      # `biome check`, not `biome lint`: it also gates formatting and import
      # order, which is what `build:ci` enforces further down. Running it here
      # means a formatting break fails fast, under a step named for it.
      - name: Lint
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build:ci

      # Catches a broken shim or a bad basePath before it reaches Pages.
      - name: Build the terminal
        run: pnpm run build:web
